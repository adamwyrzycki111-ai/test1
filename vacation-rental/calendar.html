<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - StayHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="sidebar"></div>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Availability Calendar</h1>
                <p class="page-subtitle">Manage your property availability</p>
            </div>

            <div class="grid-2">
                <div>
                    <div class="card">
                        <div class="form-group">
                            <label class="form-label">Select Property</label>
                            <select class="form-input">
                                <option>Seaside Villa Paradise</option>
                                <option>Mountain Retreat Cabin</option>
                                <option>Lake House Escape</option>
                            </select>
                        </div>
                    </div>

                    <div class="calendar mt-lg">
                        <div class="calendar-header">
                            <button class="btn btn-sm btn-ghost" onclick="prevMonth()">←</button>
                            <h3 class="calendar-title" id="calendarTitle">May 2026</h3>
                            <button class="btn btn-sm btn-ghost" onclick="nextMonth()">→</button>
                        </div>
                        <div class="calendar-grid" id="calendarGrid"></div>
                    </div>

                    <div class="flex gap-lg mt-lg">
                        <div class="flex items-center gap-sm"><span class="calendar-day" style="background: var(--success-light);"></span><span class="text-sm">Available</span></div>
                        <div class="flex items-center gap-sm"><span class="calendar-day" style="background: var(--error-light);"></span><span class="text-sm">Booked</span></div>
                        <div class="flex items-center gap-sm"><span class="calendar-day" style="background: var(--warning-light);"></span><span class="text-sm">Pending</span></div>
                        <div class="flex items-center gap-sm"><span class="calendar-day" style="background: var(--bg-tertiary);"></span><span class="text-sm">Blocked</span></div>
                    </div>
                </div>

                <div>
                    <h3 class="mb-lg">Manage Availability</h3>
                    <div class="card">
                        <div class="form-group">
                            <label class="form-label">Block Dates</label>
                            <div class="form-row">
                                <input type="date" class="form-input">
                                <input type="date" class="form-input">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Reason</label>
                            <select class="form-input">
                                <option>Maintenance</option>
                                <option>Personal Use</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <button class="btn btn-secondary w-full">Block Dates</button>
                    </div>

                    <div class="card mt-lg">
                        <h4 class="mb-md">Quick Actions</h4>
                        <div class="flex flex-col gap-sm">
                            <button class="btn btn-secondary">Mark All Available This Month</button>
                            <button class="btn btn-secondary">Mark All Booked This Month</button>
                            <button class="btn btn-secondary">Clear All Blocks</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
    <script>
        let calendarDate = new Date(2026, 4, 1); // May 2026

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let html = dayNames.map(d => `<div class="calendar-day-header">${d}</div>`).join('');

            const firstDay = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1);
            const lastDay = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startDay = firstDay.getDay();

            for (let i = 0; i < startDay; i++) {
                html += `<div class="calendar-day other-month"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), day);
                const isToday = date.toDateString() === new Date().toDateString();
                html += `<div class="calendar-day ${isToday ? 'today' : ''}" onclick="selectDate(${day})">${day}</div>`;
            }

            grid.innerHTML = html;
            document.getElementById('calendarTitle').textContent = firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        function prevMonth() {
            calendarDate.setMonth(calendarDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            calendarDate.setMonth(calendarDate.getMonth() + 1);
            renderCalendar();
        }

        function selectDate(day) {
            alert(`Selected: ${calendarDate.getMonth() + 1}/${day}/${calendarDate.getFullYear()}`);
        }

        renderCalendar();
    </script>
</body>
</html>
